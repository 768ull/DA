name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK sem o nome debug
        run: |
          VERSION=$(awk -F'"' '/versionName =/{print $2; exit}' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "duckai-v${VERSION}.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: duckai-apk
          path: duckai-v*.apk
          if-no-files-found: error

      - name: Publicar no menu de versoes (apenas ramificacao main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "duckai-v${VERSION}.apk" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "duckai-v${VERSION}.apk" \
              --title "Duck.ai v${VERSION}" \
              --target "$GITHUB_SHA" \
              --notes "Aplicativo Duck.ai (WebView nativo). APK de instalacao direta, sem o nome debug. O menu de versoes contem apenas o aplicativo WebView; a versao nativa em Jetpack Compose nao e publicada aqui." \
              -R "$GITHUB_REPOSITORY"
          fi

  versoes-anteriores:
    name: Publicar v${{ matrix.version }} no menu de versoes
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publicar-versoes-anteriores]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.0"
            sha: e56ed029158ca1c99bc30e65ab46d61212506ff2
            notas: "Versao inicial: WebView nativo do sistema com zoom totalmente bloqueado em tres camadas."
          - version: "1.1"
            sha: 8accbf6b00c041f7ae9f413f92f54e2d8ff92d5f
            notas: "Icone oficial do DuckDuckGo, remocao da tela de carregamento e abertura mais rapida."
          - version: "1.2"
            sha: 2fcc602c2c499f3ca7bb849fc5d23eaa461b2749
            notas: "Primeira barreira de estabilidade lateral: overscroll desativado e barras de rolagem ocultas."
          - version: "1.3"
            sha: 84895a95890c80f6bb2b95e9d4e9d9ff61c38e72
            notas: "Trava fisica da rolagem horizontal no nivel do componente; pagina do Duck.ai intocada."
          - version: "1.4"
            sha: 66f75f75f814294625c38cf39d635b376072caa5
            notas: "Interceptacao de gestos horizontais no nivel do componente; rolagem vertical preservada."
    steps:
      - name: Checkout da versao v${{ matrix.version }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK da versao v${{ matrix.version }}
        run: gradle assembleDebug --no-daemon

      - name: Publicar v${{ matrix.version }} no menu de versoes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ matrix.version }}"
          APK="duckai-v${{ matrix.version }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" \
              --title "Duck.ai v${{ matrix.version }}" \
              --target "${{ matrix.sha }}" \
              --notes "${{ matrix.notas }}" \
              -R "$GITHUB_REPOSITORY"
          fi
